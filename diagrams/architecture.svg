<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">ODSINET — system architecture</text>
  <text x="520" y="56" text-anchor="middle" font-size="11.5" fill="#64748b">Invoices and Tunisian bills of exchange · fine-tuned GLM-OCR + LangGraph agents + human-in-the-loop review</text>

  <rect x="40" y="90" width="270" height="150" rx="10" stroke-width="1.5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="58" y="118" font-size="15" font-weight="bold" fill="#0f172a">Frontend — React + Vite (:3000)</text>
  <text x="58" y="144" font-size="12.5" fill="#334155">Upload / camera capture</text>
  <text x="58" y="164" font-size="12.5" fill="#334155">Field review and correction (HITL)</text>
  <text x="58" y="184" font-size="12.5" fill="#334155">Dashboard, history, calendar</text>
  <text x="58" y="204" font-size="12.5" fill="#334155">Chatbot widget</text>
  <text x="58" y="226" font-size="11.5" fill="#64748b">English / French interface</text>

  <rect x="385" y="90" width="300" height="190" rx="10" stroke-width="1.5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="403" y="118" font-size="15" font-weight="bold" fill="#0f172a">Inference API — Modal, T4 GPU</text>
  <text x="403" y="144" font-size="12.5" fill="#334155">1. MobileNetV2 → document type (CPU)</text>
  <text x="403" y="168" font-size="12.5" fill="#334155">2a. GLM-OCR + LoRA — invoices</text>
  <text x="420" y="186" font-size="11.5" fill="#64748b">client, supplier, date, number, total amount</text>
  <text x="403" y="208" font-size="12.5" fill="#334155">2b. GLM-OCR + LoRA — bills of exchange</text>
  <text x="420" y="226" font-size="11.5" fill="#64748b">due date, amount, drawer, drawee, RIB, bank, number</text>
  <text x="403" y="252" font-size="11.5" fill="#64748b">POST /predict · weights cached in a Modal volume</text>

  <rect x="385" y="320" width="290" height="230" rx="10" stroke-width="1.5" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="403" y="348" font-size="15" font-weight="bold" fill="#0f172a">Agents API — LangGraph (:8002)</text>
  <rect x="403" y="362" width="254" height="38" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="415" y="386" font-size="12.5" fill="#334155">Agent 1 · Extractor — OCR, LLM, vision</text>
  <rect x="403" y="406" width="254" height="38" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="415" y="430" font-size="12.5" fill="#334155">Agent 2 · Auditor — deterministic checks</text>
  <rect x="403" y="450" width="254" height="38" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="415" y="474" font-size="12.5" fill="#334155">Agent 3 · Analyst — anomalies, insights</text>
  <rect x="403" y="494" width="254" height="38" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="415" y="518" font-size="12.5" fill="#334155">Agent 4 · Chatbot — questions</text>

  <rect x="750" y="90" width="250" height="110" rx="10" stroke-width="1.5" fill="#fff7ed" stroke="#ea580c"/>
  <text x="768" y="118" font-size="15" font-weight="bold" fill="#0f172a">Hugging Face Hub</text>
  <text x="768" y="144" font-size="12.5" fill="#334155">Goubaa/glmocr-factures</text>
  <text x="768" y="164" font-size="12.5" fill="#334155">Goubaa/glm-traite-tunis</text>
  <text x="768" y="184" font-size="12.5" fill="#334155">Goubaa/mobilenet-classifier</text>

  <rect x="750" y="320" width="250" height="100" rx="10" stroke-width="1.5" fill="#f8fafc" stroke="#0f172a"/>
  <text x="768" y="348" font-size="15" font-weight="bold" fill="#0f172a">PostgreSQL 16</text>
  <text x="768" y="374" font-size="12.5" fill="#334155">documents · factures · traites</text>
  <text x="768" y="394" font-size="11.5" fill="#64748b">history, duplicate detection</text>

  <rect x="750" y="450" width="250" height="100" rx="10" stroke-width="1.5" fill="#fefce8" stroke="#ca8a04"/>
  <text x="768" y="478" font-size="15" font-weight="bold" fill="#0f172a">External services</text>
  <text x="768" y="502" font-size="12.5" fill="#334155">Groq · Gemini · HF Inference · OpenAI</text>
  <text x="768" y="522" font-size="12.5" fill="#334155">OCR.space · Gmail SMTP (alerts)</text>

  <rect x="40" y="320" width="270" height="230" rx="10" stroke-width="1.5" fill="#f8fafc" stroke="#64748b"/>
  <text x="58" y="348" font-size="15" font-weight="bold" fill="#0f172a">Research and training (Kaggle T4)</text>
  <text x="58" y="374" font-size="12.5" fill="#334155">Zero-shot benchmark of 10 models</text>
  <text x="58" y="398" font-size="12.5" fill="#334155">LoRA fine-tuning (r = 4, 0.25 %)</text>
  <text x="58" y="422" font-size="12.5" fill="#334155">Resumable multi-session training</text>
  <text x="58" y="446" font-size="12.5" fill="#334155">Evaluation on held-out test sets</text>
  <text x="58" y="476" font-size="11.5" fill="#64748b">Invoices: 97.40 % field F1</text>
  <text x="58" y="496" font-size="11.5" fill="#64748b">Bills (real scans): 97.4 % fully correct</text>
  <text x="58" y="516" font-size="11.5" fill="#64748b">Classifier: 99.69 % accuracy</text>

  <path stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)" d="M310,150 L383,150"/>
  <text x="316" y="140" font-size="11.5" fill="#475569">POST /predict</text>
  <path stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)" d="M220,240 L220,296 L450,296 L450,318"/>
  <text x="228" y="290" font-size="11.5" fill="#475569">/analyse · /audit · /chat · /save</text>
  <path stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)" d="M750,145 L687,145"/>
  <text x="690" y="137" font-size="11.5" fill="#475569">weights</text>
  <path stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)" d="M675,400 L748,380"/>
  <path stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)" d="M675,470 L748,495"/>
</svg>
