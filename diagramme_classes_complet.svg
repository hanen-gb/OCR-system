<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 860" width="1460" height="860" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#000000" stroke-width="1.3"/>
    </marker>
    <marker id="triangleHollow" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,8 L0,16 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1460" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="730" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">
    Class Diagram — ODSINET
  </text>

  <!-- ============ USER (root) ============ -->
  <rect x="450" y="80" width="280" height="212" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="590" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">User</text>
  <line x1="450" y1="108" x2="730" y2="108" stroke="#000000" stroke-width="1.4"/>
  <text x="460" y="131" font-size="13" fill="#000000">- username : String</text>
  <text x="460" y="149" font-size="13" fill="#000000">- password : String</text>
  <text x="460" y="167" font-size="13" fill="#000000">- email : String</text>
  <text x="460" y="185" font-size="13" fill="#000000">- role : String</text>
  <text x="460" y="203" font-size="13" fill="#000000">- bio : String</text>
  <line x1="450" y1="218" x2="730" y2="218" stroke="#000000" stroke-width="1.4"/>
  <text x="460" y="241" font-size="13" fill="#000000">+ login()</text>
  <text x="460" y="259" font-size="13" fill="#000000">+ logout()</text>
  <text x="460" y="277" font-size="13" fill="#000000">+ updateProfile()</text>

  <!-- ============ ADMIN (child of User) ============ -->
  <rect x="20" y="340" width="200" height="84" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="120" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Admin</text>
  <line x1="20" y1="368" x2="220" y2="368" stroke="#000000" stroke-width="1.4"/>
  <text x="30" y="391" font-size="13" fill="#000000">+ deleteUser()</text>
  <text x="30" y="409" font-size="13" fill="#000000">+ manageUsers()</text>

  <!-- ============ DOCUMENT (child of User) ============ -->
  <rect x="250" y="340" width="250" height="156" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="375" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Document</text>
  <line x1="250" y1="368" x2="500" y2="368" stroke="#000000" stroke-width="1.4"/>
  <text x="260" y="391" font-size="13" fill="#000000">+ id : int</text>
  <text x="260" y="409" font-size="13" fill="#000000">+ fileName : String</text>
  <text x="260" y="427" font-size="13" fill="#000000">+ uploadDate : Date</text>
  <text x="260" y="445" font-size="13" fill="#000000">+ fileType : String</text>
  <text x="260" y="463" font-size="13" fill="#000000">+ documentType : String</text>
  <text x="260" y="481" font-size="13" fill="#000000">+ status : String</text>

  <!-- ============ CALENDAR (child of User) ============ -->
  <rect x="530" y="340" width="180" height="66" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="620" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Calendar</text>
  <line x1="530" y1="368" x2="710" y2="368" stroke="#000000" stroke-width="1.4"/>
  <text x="540" y="391" font-size="13" fill="#000000">+ displayDeadlines()</text>

  <!-- ============ DASHBOARD (child of User) ============ -->
  <rect x="740" y="340" width="200" height="84" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="840" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Dashboard</text>
  <line x1="740" y1="368" x2="940" y2="368" stroke="#000000" stroke-width="1.4"/>
  <text x="750" y="391" font-size="13" fill="#000000">+ computeStatistics()</text>
  <text x="750" y="409" font-size="13" fill="#000000">+ generateCharts()</text>

  <!-- ============ AGENTSERVICE (child of User) ============ -->
  <rect x="970" y="340" width="190" height="102" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="1065" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">AgentService</text>
  <line x1="970" y1="368" x2="1160" y2="368" stroke="#000000" stroke-width="1.4"/>
  <text x="980" y="391" font-size="13" fill="#000000">+ analyse()</text>
  <text x="980" y="409" font-size="13" fill="#000000">+ audit()</text>
  <text x="980" y="427" font-size="13" fill="#000000">+ chat()</text>

  <!-- ============ GLMOCRSERVICE (child of Document) ============ -->
  <rect x="155" y="620" width="210" height="84" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="260" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">GLMOCRService</text>
  <line x1="155" y1="648" x2="365" y2="648" stroke="#000000" stroke-width="1.4"/>
  <text x="165" y="671" font-size="13" fill="#000000">+ predict()</text>
  <text x="165" y="689" font-size="13" fill="#000000">+ extractBaseEntities()</text>

  <!-- ============ ENTITY (child of Document) ============ -->
  <rect x="395" y="620" width="200" height="120" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="495" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Entity</text>
  <line x1="395" y1="648" x2="595" y2="648" stroke="#000000" stroke-width="1.4"/>
  <text x="405" y="671" font-size="13" fill="#000000">+ label : String</text>
  <text x="405" y="689" font-size="13" fill="#000000">+ text : String</text>
  <text x="405" y="707" font-size="13" fill="#000000">+ box : String</text>
  <text x="405" y="725" font-size="13" fill="#000000">+ words : Array</text>

  <!-- ============ ANALYSIS (child of AgentService) ============ -->
  <rect x="725" y="620" width="200" height="120" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="825" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Analysis</text>
  <line x1="725" y1="648" x2="925" y2="648" stroke="#000000" stroke-width="1.4"/>
  <text x="735" y="671" font-size="13" fill="#000000">+ analysisId : int</text>
  <text x="735" y="689" font-size="13" fill="#000000">+ alertLevel : String</text>
  <text x="735" y="707" font-size="13" fill="#000000">+ insights : String</text>
  <text x="735" y="725" font-size="13" fill="#000000">+ anomalies : String</text>

  <!-- ============ AUDITREPORT (child of AgentService) ============ -->
  <rect x="955" y="620" width="220" height="102" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="1065" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">AuditReport</text>
  <line x1="955" y1="648" x2="1175" y2="648" stroke="#000000" stroke-width="1.4"/>
  <text x="965" y="671" font-size="13" fill="#000000">+ validationStatus : String</text>
  <text x="965" y="689" font-size="13" fill="#000000">+ checks : JSON</text>
  <text x="965" y="707" font-size="13" fill="#000000">+ verdict : String</text>

  <!-- ============ CHATBOT (child of AgentService) ============ -->
  <rect x="1205" y="620" width="200" height="84" fill="#69C6EE" stroke="#000000" stroke-width="1.4"/>
  <text x="1305" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Chatbot</text>
  <line x1="1205" y1="648" x2="1405" y2="648" stroke="#000000" stroke-width="1.4"/>
  <text x="1215" y="671" font-size="13" fill="#000000">+ sendMessage()</text>
  <text x="1215" y="689" font-size="13" fill="#000000">+ generateResponse()</text>

  <!-- ============ RELATIONSHIPS ============ -->

  <!-- Admin extends User (generalization) -->
  <line x1="120" y1="340" x2="470" y2="292" stroke="#000000" stroke-width="1.4" marker-end="url(#triangleHollow)"/>

  <!-- User -> Document : owns -->
  <line x1="530" y1="292" x2="375" y2="340" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="500" y="308" font-size="12" fill="#000000">1</text>
  <text x="385" y="335" font-size="12" fill="#000000">0..*</text>
  <text x="440" y="320" font-size="12" font-style="italic" fill="#000000">owns</text>

  <!-- User -> Calendar : consults -->
  <line x1="590" y1="292" x2="620" y2="340" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="565" y="308" font-size="12" fill="#000000">1</text>
  <text x="628" y="335" font-size="12" fill="#000000">1</text>
  <text x="598" y="320" font-size="12" font-style="italic" fill="#000000">consults</text>

  <!-- User -> Dashboard : consults -->
  <line x1="650" y1="292" x2="840" y2="340" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="660" y="308" font-size="12" fill="#000000">1</text>
  <text x="810" y="335" font-size="12" fill="#000000">1</text>
  <text x="730" y="312" font-size="12" font-style="italic" fill="#000000">consults</text>

  <!-- User -> AgentService : uses (AgentService is a shared singleton service) -->
  <line x1="710" y1="292" x2="1065" y2="340" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="715" y="308" font-size="12" fill="#000000">0..*</text>
  <text x="1030" y="335" font-size="12" fill="#000000">1</text>
  <text x="880" y="310" font-size="12" font-style="italic" fill="#000000">uses</text>

  <!-- Document -> GLMOCRService : uses (GLMOCRService is a shared singleton service) -->
  <line x1="320" y1="496" x2="260" y2="620" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="296" y="512" font-size="12" fill="#000000">0..*</text>
  <text x="270" y="615" font-size="12" fill="#000000">1</text>
  <text x="275" y="560" font-size="12" font-style="italic" fill="#000000">uses</text>

  <!-- Document -> Entity : contains -->
  <line x1="430" y1="496" x2="495" y2="620" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="436" y="512" font-size="12" fill="#000000">1</text>
  <text x="500" y="615" font-size="12" fill="#000000">1..*</text>
  <text x="450" y="560" font-size="12" font-style="italic" fill="#000000">contains</text>

  <!-- AgentService -> Analysis : produces (one shared service produces many analysis reports) -->
  <line x1="1000" y1="442" x2="825" y2="620" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="970" y="458" font-size="12" fill="#000000">1</text>
  <text x="835" y="615" font-size="12" fill="#000000">0..*</text>
  <text x="890" y="540" font-size="12" font-style="italic" fill="#000000">produces</text>

  <!-- AgentService -> AuditReport : produces (one shared service produces many audit reports) -->
  <line x1="1065" y1="442" x2="1065" y2="620" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="1040" y="458" font-size="12" fill="#000000">1</text>
  <text x="1040" y="615" font-size="12" fill="#000000">0..*</text>
  <text x="1075" y="540" font-size="12" font-style="italic" fill="#000000">produces</text>

  <!-- AgentService -> Chatbot : uses (1-1 internal component) -->
  <line x1="1130" y1="442" x2="1305" y2="620" stroke="#000000" stroke-width="1.4" marker-end="url(#arrowOpen)"/>
  <text x="1135" y="458" font-size="12" fill="#000000">1</text>
  <text x="1275" y="615" font-size="12" fill="#000000">1</text>
  <text x="1220" y="540" font-size="12" font-style="italic" fill="#000000">uses</text>

  <!-- Note -->
  <text x="20" y="800" font-size="12" fill="#444444">
    Top-down hierarchy: every relationship line flows from the bottom edge of the parent class to the top edge of the child class below it.
  </text>
  <text x="20" y="818" font-size="12" fill="#444444">
    Admin correctly extends User (generalization, hollow triangle pointing up to User). No cycles in the graph.
  </text>
  <text x="20" y="836" font-size="12" fill="#444444">
    Cardinalities fixed: GLMOCRService and AgentService are shared singleton services (multiplicity "1"), each used/called by many Documents/Users ("0..*").
  </text>

</svg>
