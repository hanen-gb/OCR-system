<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 460" width="1220" height="460" font-family="Arial, Helvetica, sans-serif">

  <!-- Fond blanc -->
  <rect x="0" y="0" width="1220" height="460" fill="#ffffff"/>

  <!-- Titre -->
  <text x="610" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">
    Diagramme de classes simplifié — ODSINET
  </text>

  <!-- ============ CLASSE Utilisateur ============ -->
  <rect x="40" y="200" width="220" height="92" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="150" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Utilisateur</text>
  <line x1="40" y1="236" x2="260" y2="236" stroke="#000000" stroke-width="1.5"/>
  <text x="50" y="258" font-size="13" fill="#000000">+username : string</text>
  <text x="50" y="278" font-size="13" fill="#000000">+role : string</text>

  <!-- ============ CLASSE Document ============ -->
  <rect x="340" y="160" width="240" height="132" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Document</text>
  <line x1="340" y1="196" x2="580" y2="196" stroke="#000000" stroke-width="1.5"/>
  <text x="350" y="218" font-size="13" fill="#000000">+id : string</text>
  <text x="350" y="238" font-size="13" fill="#000000">+filename : string</text>
  <text x="350" y="258" font-size="13" fill="#000000">+docType : string</text>
  <text x="350" y="278" font-size="13" fill="#000000">+entites : JSON</text>

  <!-- ============ CLASSE GLMOCRService ============ -->
  <rect x="660" y="60" width="230" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="775" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">GLMOCRService</text>
  <line x1="660" y1="96" x2="890" y2="96" stroke="#000000" stroke-width="1.5"/>
  <text x="670" y="118" font-size="13" fill="#000000">+predict()</text>

  <!-- ============ CLASSE AgentService ============ -->
  <rect x="660" y="200" width="230" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="775" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">AgentService</text>
  <line x1="660" y1="236" x2="890" y2="236" stroke="#000000" stroke-width="1.5"/>
  <text x="670" y="258" font-size="13" fill="#000000">+analyse()</text>
  <text x="670" y="278" font-size="13" fill="#000000">+audit()</text>
  <text x="670" y="298" font-size="13" fill="#000000">+chat()</text>

  <!-- ============ CLASSE RapportAudit ============ -->
  <rect x="970" y="160" width="210" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1075" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">RapportAudit</text>
  <line x1="970" y1="196" x2="1180" y2="196" stroke="#000000" stroke-width="1.5"/>
  <text x="980" y="218" font-size="13" fill="#000000">+statutValidite : string</text>

  <!-- ============ CLASSE RapportAnalyste ============ -->
  <rect x="970" y="290" width="210" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1075" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">RapportAnalyste</text>
  <line x1="970" y1="326" x2="1180" y2="326" stroke="#000000" stroke-width="1.5"/>
  <text x="980" y="348" font-size="13" fill="#000000">+niveauAlerte : string</text>

  <!-- ============ RELATIONS ============ -->

  <!-- Utilisateur -> Document : analyse -->
  <line x1="260" y1="246" x2="340" y2="226" stroke="#000000" stroke-width="1.5"/>
  <text x="266" y="238" font-size="12" fill="#000000">1</text>
  <text x="312" y="220" font-size="12" fill="#000000">0..*</text>
  <text x="280" y="204" font-size="12" font-style="italic" fill="#000000">analyse</text>

  <!-- Document -> GLMOCRService : utilise -->
  <line x1="580" y1="185" x2="660" y2="96" stroke="#000000" stroke-width="1.5"/>
  <text x="586" y="180" font-size="12" fill="#000000">1</text>
  <text x="640" y="104" font-size="12" fill="#000000">1</text>
  <text x="595" y="135" font-size="12" font-style="italic" fill="#000000">utilise</text>

  <!-- Document -> AgentService : utilise -->
  <line x1="580" y1="260" x2="660" y2="240" stroke="#000000" stroke-width="1.5"/>
  <text x="586" y="254" font-size="12" fill="#000000">1</text>
  <text x="636" y="236" font-size="12" fill="#000000">1</text>
  <text x="595" y="272" font-size="12" font-style="italic" fill="#000000">utilise</text>

  <!-- AgentService -> RapportAudit : produit -->
  <line x1="890" y1="225" x2="970" y2="196" stroke="#000000" stroke-width="1.5"/>
  <text x="896" y="220" font-size="12" fill="#000000">1</text>
  <text x="950" y="201" font-size="12" fill="#000000">1</text>
  <text x="905" y="190" font-size="12" font-style="italic" fill="#000000">produit</text>

  <!-- AgentService -> RapportAnalyste : produit -->
  <line x1="890" y1="290" x2="970" y2="326" stroke="#000000" stroke-width="1.5"/>
  <text x="896" y="296" font-size="12" fill="#000000">1</text>
  <text x="950" y="322" font-size="12" fill="#000000">1</text>
  <text x="905" y="335" font-size="12" font-style="italic" fill="#000000">produit</text>

  <!-- Note -->
  <text x="40" y="420" font-size="12" fill="#444444">
    Note : simplifié — Entité (champs extraits) et MessageChat (Agent 4) omis volontairement pour la lisibilité.
  </text>

</svg>
